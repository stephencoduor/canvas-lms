name: Deploy Canvas LMS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SERVER_HOST: 148.230.111.247
  SERVER_USER: root
  DEPLOY_DIR: /opt/canvas-lms

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'DEPLOY_SCRIPT'

          set -e
          DEPLOY_DIR="/opt/canvas-lms"
          CONF_DIR="$DEPLOY_DIR/deploy"

          echo "=== Pulling latest code ==="
          cd $DEPLOY_DIR
          git fetch origin master
          git reset --hard origin/master

          echo "=== Copying config files ==="
          cp deploy/config/database.yml config/database.yml
          cp deploy/config/domain.yml config/domain.yml
          cp deploy/config/redis.yml config/redis.yml
          cp deploy/config/cache_store.yml config/cache_store.yml
          cp deploy/config/security.yml config/security.yml
          cp deploy/config/outgoing_mail.yml config/outgoing_mail.yml
          cp deploy/config/delayed_jobs.yml config/delayed_jobs.yml
          cp deploy/config/dynamic_settings.yml config/dynamic_settings.yml

          echo "=== Rebuilding Docker image ==="
          cd $CONF_DIR
          docker compose -f docker-compose.production.yml --env-file .env.production build web

          echo "=== Running migrations ==="
          docker compose -f docker-compose.production.yml --env-file .env.production run --rm web \
            bundle exec rake db:migrate || true

          echo "=== Restarting services ==="
          docker compose -f docker-compose.production.yml --env-file .env.production up -d

          echo "=== Waiting for health check ==="
          sleep 30
          curl -sf http://localhost:80/health_check || echo "Health check pending (Canvas may still be starting)"

          echo "=== Deployment complete ==="
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://lms.k8s-gke.us" || echo "000")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "Deployment verified: HTTP $STATUS"
          else
            echo "Warning: HTTP $STATUS - Canvas may still be starting up"
          fi
