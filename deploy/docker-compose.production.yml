version: '3.8'

services:
  # ═══════════════════════════════════════
  # Canvas Web Application (Passenger/Nginx)
  # ═══════════════════════════════════════
  web:
    build:
      context: ..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: .env.production
    environment:
      CANVAS_DATABASE_HOST: postgres
      CANVAS_DATABASE_USERNAME: ${POSTGRES_USER}
      CANVAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CANVAS_DATABASE_PRODUCTION: ${POSTGRES_DB}
      CANVAS_DOMAIN: ${CANVAS_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
    volumes:
      - canvas_uploads:/usr/src/app/tmp/files
      - canvas_log:/usr/src/app/log
      - canvas_brandable:/usr/src/app/public/dist/brandable_css
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G

  # ═══════════════════════════════════════
  # Background Job Workers
  # ═══════════════════════════════════════
  jobs:
    build:
      context: ..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: bundle exec script/delayed_job run
    env_file: .env.production
    environment:
      CANVAS_DATABASE_HOST: postgres
      CANVAS_DATABASE_USERNAME: ${POSTGRES_USER}
      CANVAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CANVAS_DATABASE_PRODUCTION: ${POSTGRES_DB}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: production
    volumes:
      - canvas_uploads:/usr/src/app/tmp/files
      - canvas_log:/usr/src/app/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  # ═══════════════════════════════════════
  # PostgreSQL 14 Database
  # ═══════════════════════════════════════
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_locks_per_transaction=640
      -c max_stack_depth=5MB
      -c random_page_cost=1.0
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c effective_cache_size=2GB
    deploy:
      resources:
        limits:
          memory: 1G

  # ═══════════════════════════════════════
  # Redis Cache & Session Store
  # ═══════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ═══════════════════════════════════════
  # Nginx Reverse Proxy (SSL + Proxy)
  # ═══════════════════════════════════════
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  # ═══════════════════════════════════════
  # Certbot (Let's Encrypt SSL)
  # ═══════════════════════════════════════
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  canvas_uploads:
    driver: local
  canvas_log:
    driver: local
  canvas_brandable:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  certbot_www:
    driver: local
